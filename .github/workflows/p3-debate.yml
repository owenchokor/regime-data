name: p3-debate
# ③v2 3축 토론. forward.yml이 월말에 호출(workflow_call), 테스트는 수동(workflow_dispatch).
# 왜 축별 별도 세션: 한 세션에서 3역할을 하면 앞 역할 의견이 뒤 역할에 새어 독립성이 깨짐
on:
  workflow_call:
    inputs:
      month: { type: string, required: true }
      in_dir: { type: string, default: forward/decisions }
      reuse_scores: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      month: { type: string, required: true }
      in_dir: { type: string, default: phase3/test }
      reuse_scores: { type: boolean, default: false, description: "기존 scores로 선정·이미지·텔레그램만 재실행(LLM 미사용)" }
concurrency: { group: p3-debate, cancel-in-progress: false }
jobs:
  debate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      id-token: write
    env:
      D: ${{ inputs.month }}
      IN: ${{ inputs.in_dir }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_KEY }}
      TG_CHAT: ${{ secrets.CHAT_ID }}
      TOOLS: "--allowedTools Read,Write,Edit,MultiEdit,Glob,Grep,WebSearch,WebFetch --max-turns 250"   # 임의값, 튜닝 필요 (3종목 테스트 축당 약 3분 → 20종목 확장 시 턴 부족 방지)
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 왜: 호출 시점 SHA에는 방금 커밋된 decisions CSV가 없음
      - run: |
          pip install -q pandas requests matplotlib
          sudo apt-get install -y -q fonts-nanum >/dev/null   # 채점표 한글 렌더링
      - name: 입력 확인·시작 알림
        run: |
          test -s "$IN/$D.csv" || { echo "입력 없음 $IN/$D.csv"; exit 1; }
          mkdir -p "$IN/work"
          [ "${{ inputs.reuse_scores }}" = "true" ] || curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="🗣 ${D} ③v2 에이전트 토론 진행중... ($(($(wc -l < "$IN/$D.csv") - 1))종목)"
      - name: 사용자 리포트 내려받기 (러너 전용, 커밋 안 함)
        run: python3 phase3/inbox.py fetch "$D"
      - name: G 성장·기대치
        id: g
        if: ${{ !inputs.reuse_scores }}
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 50
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "phase3/debate_prompt.md 를 읽고 1단계를 AXIS=G 로 수행하라. D=${{ inputs.month }}, IN=${{ inputs.in_dir }}, OUT=${{ inputs.in_dir }}"
          claude_args: ${{ env.TOOLS }}
      - name: G 확인
        if: ${{ always() && !inputs.reuse_scores }}
        run: python3 phase3/check_axis.py G "${{ steps.g.outputs.execution_file }}"
      - name: V 가치·재무·딜
        id: v
        if: ${{ !inputs.reuse_scores }}
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 50
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "phase3/debate_prompt.md 를 읽고 1단계를 AXIS=V 로 수행하라. D=${{ inputs.month }}, IN=${{ inputs.in_dir }}, OUT=${{ inputs.in_dir }}"
          claude_args: ${{ env.TOOLS }}
      - name: V 확인
        if: ${{ always() && !inputs.reuse_scores }}
        run: python3 phase3/check_axis.py V "${{ steps.v.outputs.execution_file }}"
      - name: M 시장·모멘텀·거시
        id: m
        if: ${{ !inputs.reuse_scores }}
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 50
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "phase3/debate_prompt.md 를 읽고 1단계를 AXIS=M 으로 수행하라. D=${{ inputs.month }}, IN=${{ inputs.in_dir }}, OUT=${{ inputs.in_dir }}"
          claude_args: ${{ env.TOOLS }}
      - name: M 확인
        if: ${{ always() && !inputs.reuse_scores }}
        run: python3 phase3/check_axis.py M "${{ steps.m.outputs.execution_file }}"
      - name: 반박·종합
        id: s
        if: ${{ !inputs.reuse_scores }}
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 50
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "phase3/debate_prompt.md 를 읽고 2단계(SYNTH)를 수행하라. D=${{ inputs.month }}, IN=${{ inputs.in_dir }}, OUT=${{ inputs.in_dir }}"
          claude_args: "--allowedTools Read,Write,Edit,MultiEdit,Glob,Grep --max-turns 60"
      - name: 종합 실행기록 보존
        if: always()
        run: '[ -f "${{ steps.s.outputs.execution_file }}" ] && cp "${{ steps.s.outputs.execution_file }}" "$RUNNER_TEMP/exec_S.json" || true'
      - name: 사용량 기록
        # 왜: 구독 사용량은 API로 조회 불가 → 세션별 소요시간·턴·토큰·API환산비용을 남겨 규모 추정
        if: ${{ always() && !inputs.reuse_scores }}
        run: python3 phase3/metrics.py "$IN/work/${D}_metrics.json"
      - name: 결과 검증·선정
        id: pick
        run: |
          python3 phase3/finalize.py "$IN" "$D"
          python3 phase3/render.py "$IN" "$D"
      - name: 커밋
        if: always()   # 왜: 실패해도 축별 의견·토론 전문을 남겨 원인 확인·수기 채점에 사용
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$IN"
          git commit -qm "p3-debate: ${D} ③v2 채점" || echo "no change"
          git pull --rebase -q && git push -q
      - name: 텔레그램 결과
        if: success()
        run: |
          ok() { python3 -c "import json,sys;d=json.load(sys.stdin);print('send:',d.get('ok'),d.get('description'));sys.exit(0 if d.get('ok') else 1)"; }
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode chat_id="$TG_CHAT" --data-urlencode text@"$IN/${D}_telegram.txt" | ok
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendPhoto" -F chat_id="$TG_CHAT" -F photo=@"$IN/${D}_scorecard.png" -F caption="③v2 채점표 ${D}" | ok
      - name: 폴백
        if: failure()
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="⚠️ ${D} 토론 실패 — 수기 채점 필요 · 실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
