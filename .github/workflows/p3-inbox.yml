name: p3-inbox
# 왜 3시간 간격: 봇이 받은 메시지는 텔레그램 서버에 24시간만 보관 → 주말 포함 하루 여러 번 수거
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
concurrency: { group: p3-inbox, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_KEY }}
      TG_CHAT: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: Collect
        run: |
          gh release download data-latest -p inbox_state.json --clobber || echo "state 없음(최초)"
          python phase3/inbox.py collect
          gh release upload data-latest inbox_state.json --clobber
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3/inbox/index.csv 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "p3-inbox: 리포트 색인 갱신"; git pull --rebase -q && git push -q; }
