name: fetch-extra
on:
  workflow_dispatch:
  push:
    branches: [extra-data]
    paths: [collect/fetch_extra.py, .github/workflows/fetch-extra.yml]
jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt finance-datareader
      - run: mkdir -p data && gh release download data-latest -p kospi.parquet -D data --clobber
      - name: Fetch extra
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect/fetch_extra.py
      - name: Upload
        if: always()
        run: gh release upload data-latest data/extra_log.json data/sector_monthly.parquet data/index_extra_* data/admin_snapshot_* --clobber || gh release upload data-latest data/extra_log.json --clobber || true
