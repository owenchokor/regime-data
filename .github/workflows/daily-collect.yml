name: daily-collect

on:
  schedule:
    - cron: "0 22 * * 0-4"   # UTC 22:00 = KST 07:00 (화~금·월 아침, 전일 장 반영)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Fetch index data (KRX)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect/fetch_index.py

      - name: Fetch macro data (FRED)
        run: python collect/fetch_macro.py

      # 왜: release를 지우면 수동 업로드한 close.zip까지 사라짐 → 덮어쓰기만
      - name: Upload to Release (data-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "data-latest" --notes "auto + manual data"
          gh release upload data-latest data/*.parquet --clobber
