name: daily-collect

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 매일 UTC 22:00 = KST 07:00 다음날, 장마감 후
  workflow_dispatch:           # 수동 트리거

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Release 업로드에 필요
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch index data (KRX)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect/fetch_index.py

      - name: Fetch macro data (FRED)
        run: python collect/fetch_macro.py

      - name: Upload to Release (data-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-latest"
          gh release delete $TAG --yes 2>/dev/null || true
          gh release create $TAG data/*.parquet \
            --title "Latest data $(date -u +%Y-%m-%d)" \
            --notes "Auto-updated $(date -u +%Y-%m-%dT%H:%M:%SZ)"
